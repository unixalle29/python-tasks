[project]
name = "python-tasks"
version = "0.1.1"
description = "Лабораторные задачи по Python (edu2u.ru, ПетрГУ)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "PyQt6>=6.7",
]

[dependency-groups]
lint = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]
tests = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-qt>=4.4.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["lint", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["python_tasks"]

[tool.coverage.report]
show_missing = true
